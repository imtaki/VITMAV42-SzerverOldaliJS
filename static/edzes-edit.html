<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edzés szerkesztése | 5% Fit</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=fitness_center">
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <div class="logo"><span class="material-symbols-outlined">
                    fitness_center
                </span> 5% Fit</div>
            <nav class="nav">
                <a class="nav-link" href="index.html"><svg viewBox="0 0 24 24">
                        <path d="M3 10.5 12 3l9 7.5" />
                        <path d="M5 9.5V21h14V9.5" />
                        <path d="M9 21v-6h6v6" />
                    </svg> Dashboard</a>
                <a class="nav-link " href="edzok.html"><svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="3.5" />
                        <path d="M5 21c.7-4 3-6 7-6s6.3 2 7 6" />
                    </svg> Személyi edzők</a>
                <a class="nav-link active" href="edzesek.html"><svg viewBox="0 0 24 24">
                        <path d="M7 4v16M17 4v16M4 8h16M4 16h16" />
                    </svg> Edzések</a>
            </nav>
            <div class="sidebar-bottom">
                <a class="settings-link" href="#"><svg viewBox="0 0 24 24">
                        <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" />
                        <path
                            d="m19 13.5 1.5 1-2 3.5-1.7-.7a8 8 0 0 1-2.2 1.3L14.4 20h-4l-.2-1.9a8 8 0 0 1-2.2-1.3l-1.7.7-2-3.5 1.5-1a8 8 0 0 1 0-2.5l-1.5-1 2-3.5 1.7.7A8 8 0 0 1 10.2 5L10.4 3h4l.2 2a8 8 0 0 1 2.2 1.2l1.7-.7 2 3.5-1.5 1a8 8 0 0 1 0 2.5Z" />
                    </svg> Beállítások</a>
            </div>
        </aside>

        <main class="content">

            <h1>Edzés szerkesztése</h1>
            <p class="subtitle">Edzés adatainak módosítása.</p>

            <section class="panel">
                <form>

                    <p>
                        <label for="nev">Edzés neve</label><br>
                        <input type="text" id="nev" name="nev" value="Mell és hát" required>
                    </p>

                    <p>
                        <label for="tipus">Típus</label><br>
                        <select id="tipus" name="tipus">
                            <option value="sulyzos" selected>Súlyzós</option>
                            <option value="kardio">Kardió</option>
                        </select>
                    </p>

                    <p>
                        <label for="idotartam">Időtartam (perc)</label><br>
                        <input type="number" id="idotartam" name="idotartam" value="60" required>
                    </p>

                    <p>
                        <label for="edzo">Edző</label><br>
                        <select id="edzo" name="edzo">
                            <option value="peter" selected>Péter</option>
                            <option value="anna">Anna</option>
                            <option value="gabor">Gábor</option>
                        </select>
                    </p>

                    <a href="edzesek.html" class="btn-secondary">Mégse</a>
                    <button type="submit" class="btn-primary">Mentés</button>

                </form>
            </section>

        </main>
    </div>
</body>

</html>
